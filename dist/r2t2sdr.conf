# r2t2sdr configuration

# 8073 is afu-remote's page on the same machine; it reaches the engine here
port = 8074
# only this address (127.0.0.1: reachable through afu-remote only); empty = all
#listen =
www = /opt/r2t2sdr/www
interface = rad0

title = R2T2 WebSDR
callsign =
location =
locator =

# FPGA clock in Hz (set by r2t2_init)
clock = 122880000

# PGA gain per ADC in dB (-9..32) and attenuator in dB (0..31)
gain1 = 0
gain2 = 0
att1 = 0
att2 = 0

waterfall_fps = 10
max_clients = 48
# listeners fed from the wide stream, ~3.6 % of a core each plus ~7 % per segment with
# listeners (two cores, two listener threads); 30 keep full audio with all 8 receivers
# on waterfalls
max_listeners = 30

# engine mode for afu-remote (optional): WebSocket sessions with a ticket signed by
# afu-remote on the station, and a Unix socket for status and the online list
#ticket_secret = /etc/r2t2sdr-ticket.key
#ticket_device = sdr
#ticket_only = 0
#control_socket = /run/r2t2sdr.sock
#control_group = afu-remote

# band = name, centre frequency in Hz, antenna input (1..3), default mode[, lower edge, upper edge]
# A band starts with 192 kHz around its centre and is widened over up to 4
# receivers to its edges while receivers are free. Edges default to IARU
# region 1. Without band lines a default set is used.
band = 160m, 1900000, 1, lsb
band = 80m, 3650000, 1, lsb
band = 60m, 5359000, 1, usb
band = 49m Rundfunk, 6050000, 1, am
band = 40m, 7100000, 1, lsb
band = 41m Rundfunk, 7350000, 1, am
band = 31m Rundfunk, 9600000, 1, am
band = 30m, 10125000, 1, cw
band = 20m, 14175000, 1, usb
band = 17m, 18118000, 1, usb
band = 15m, 21225000, 1, usb
band = 12m, 24940000, 1, usb
band = 11m CB, 27205000, 1, am
band = 10m, 28500000, 1, usb
band = 6m, 50100000, 1, usb
